[package]
name = "force-core-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "WebAssembly bindings for force-core: the force state and legal-move application for the web shell."
repository = "https://github.com/LairBob/force-chess"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
force-core = { path = ".." }
shakmaty = "=0.30.2"
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.130"
